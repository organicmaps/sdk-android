name: Android SDK Samples
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Organic Maps source ref to build
        type: string
        default: master

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: samples
      - uses: actions/checkout@v6
        with:
          repository: organicmaps/organicmaps
          ref: ${{ inputs.sdk_ref || 'master' }}
          path: engine
          fetch-depth: 200
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install native build tools
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build
      - name: Publish fresh SDK artifacts for the samples
        working-directory: engine/android
        run: ./gradlew -Parm64 -PsdkVersion=0.0.0-sdk-check publishSdkForChecks
      - name: Build, lint and check Kotlin style for all samples
        working-directory: samples
        run: ./gradlew -PsdkRepository="$GITHUB_WORKSPACE/engine/android/build/sdk-check/repository" -PsdkVersion=0.0.0-sdk-check checkSamples
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sample-reports
          path: samples/app/build/reports
