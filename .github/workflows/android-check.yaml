name: Android SDK Samples
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: Organic Maps source ref (defaults to the pinned integration revision)
        type: string

env:
  # Contains publishSdkForChecks from organicmaps/organicmaps#14025.
  SDK_REF: 9b5343caf0d19f1a6e06511fdac5d6f7e59a1f12

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  samples:
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
        with:
          path: samples
      - uses: actions/checkout@v6
        with:
          repository: organicmaps/organicmaps
          ref: ${{ inputs.sdk_ref || env.SDK_REF }}
          path: engine
          fetch-depth: 200
      - name: Initialize SDK dependencies
        working-directory: engine
        run: git submodule update --init --recursive --depth 1 --jobs 8
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache native compilation
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: sdk-samples
          save: ${{ github.ref == 'refs/heads/master' }}
      - name: Publish fresh SDK artifacts for the samples
        working-directory: engine/android
        run: ./gradlew -Px86_64 -PsdkVersion=0.0.0-sdk-check publishSdkForChecks
      - name: Build, lint and check Kotlin style for all samples
        working-directory: samples
        run: ./gradlew -PsdkRepository="$GITHUB_WORKSPACE/engine/android/build/sdk-check/repository" -PsdkVersion=0.0.0-sdk-check checkSamples
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise sample lifecycle and result-list gestures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          working-directory: samples
          script: ./gradlew -PsdkRepository="$GITHUB_WORKSPACE/engine/android/build/sdk-check/repository" -PsdkVersion=0.0.0-sdk-check connectedSamples
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sample-reports
          path: samples/app/build/reports
