name: Android Check
on:
  # TODO: Enable automatic checks once the Organic Maps SDK is published to
  # Maven Central — until then the build cannot resolve app.organicmaps.sdk:*
  # (locally it comes from mavenLocal, see README.md):
  #
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

jobs:
  android-check:
    name: Build the example app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Check Kotlin code style
        shell: bash
        run: |
          KTLINT_VERSION=1.8.0
          curl -sSL -o /tmp/ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x /tmp/ktlint
          /tmp/ktlint --editorconfig=.editorconfig "app/src/**/*.kt"

      - name: Build debug and release APKs
        shell: bash
        run: ./gradlew assembleDebug assembleRelease

      - name: Run lint
        shell: bash
        run: ./gradlew :app:lintDebug
