name: Android SDK Samples
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: Published Maven Central SDK version for a release check
        type: string
      sdk_ref:
        description: SDK source ref for development checks (ignored when sdk_version is set)
        type: string

env:
  # Baseline for source integration checks; release checks use sdk_version.
  SDK_REF: e757eeaca3664767dceec1bf33214e04023a2342
  SAMPLES_SDK_VERSION: ${{ inputs.sdk_version || '0.0.0-sdk-check' }}
  SAMPLES_SDK_REPOSITORY: ${{ inputs.sdk_version && 'https://repo.maven.apache.org/maven2' || format('{0}/engine/android/build/sdk-check/repository', github.workspace) }}

permissions:
  contents: read

concurrency:
  # SDK releases and source revisions have independent compatibility results.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.sdk_version || inputs.sdk_ref || 'baseline' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  samples:
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
        with:
          path: samples
      - uses: actions/checkout@v6
        if: ${{ !inputs.sdk_version }}
        with:
          repository: organicmaps/organicmaps
          ref: ${{ inputs.sdk_ref || env.SDK_REF }}
          path: engine
          fetch-depth: 200
      - name: Initialize SDK dependencies
        if: ${{ !inputs.sdk_version }}
        working-directory: engine
        run: git submodule update --init --recursive --depth 1 --jobs 8
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache native compilation
        if: ${{ !inputs.sdk_version }}
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: sdk-samples
          save: ${{ github.ref == 'refs/heads/master' }}
      - name: Publish fresh SDK artifacts for the samples
        if: ${{ !inputs.sdk_version }}
        working-directory: engine/android
        run: ./gradlew -Px86_64 -PsdkVersion="$SAMPLES_SDK_VERSION" publishSdkForChecks
      - name: Build, lint and check Kotlin style for all samples
        working-directory: samples
        shell: bash
        run: |
          mkdir -p app/build/ci-diagnostics
          ./gradlew --console=plain --stacktrace \
            -PsdkRepository="$SAMPLES_SDK_REPOSITORY" -PsdkVersion="$SAMPLES_SDK_VERSION" \
            checkSamples 2>&1 | tee app/build/ci-diagnostics/check-samples.log
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise sample lifecycle and result-list gestures
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 40
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          working-directory: samples
          # Collect device diagnostics before this action shuts down the emulator.
          script: bash .github/scripts/connected-samples.sh
      - name: Upload sample reports and diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sample-reports
          path: |
            samples/app/build/reports
            samples/app/build/outputs/androidTest-results
            samples/app/build/outputs/connected_android_test_additional_output
            samples/app/build/ci-diagnostics
            samples/build/reports
